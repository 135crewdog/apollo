<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apollo</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Apollo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">

  <div id="view-main" class="view">
    <header class="header">
      <h1 class="title">Apollo</h1>
      <button type="button" id="settings-btn" class="icon-btn" aria-label="Settings">&#9881;&#65039;</button>
    </header>
    <div class="seg-wrap">
      <div class="seg-tabs" role="tablist" aria-label="Screens">
        <button type="button" role="tab" data-tab="log" aria-controls="screen-log">Log</button>
        <button type="button" role="tab" data-tab="status" aria-controls="screen-status">Status</button>
      </div>
    </div>
    <div id="panels">

        <section id="screen-log" class="panel" role="tabpanel" aria-label="Log">
          <div id="lock-notice"></div>
          <div class="section">
            <div class="section-title">Kind</div>
            <div class="card">
              <div class="toggle-group" role="group" aria-label="Kind of training">
                <button type="button" data-mode="flight" aria-pressed="true">Flight</button>
                <button type="button" data-mode="sim" aria-pressed="false">Sim</button>
                <button type="button" data-mode="ground" aria-pressed="false">Ground</button>
              </div>
            </div>
          </div>
          <div class="section">
            <div class="section-title">Sortie</div>
            <div class="card">
              <div class="input-group" id="mission-field">
                <label for="mission">Mission number</label>
                <input id="mission" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. 0123">
              </div>
              <div class="input-group last">
                <label for="date">Date (Zulu)</label>
                <div class="date-field">
                  <span id="date-display" class="date-display" aria-hidden="true"></span>
                  <input id="date" type="date" required>
                </div>
              </div>
            </div>
          </div>
          <div class="section">
            <div class="section-title">Events</div>
            <input id="search" type="search" class="search" placeholder="Search events" autocomplete="off" aria-label="Search events">
            <div id="events"></div>
          </div>
          <div id="savebar" class="savebar">
            <button type="button" id="save" class="btn primary" disabled>Save</button>
          </div>
        </section>

        <section id="screen-status" class="panel" role="tabpanel" aria-label="Status">
          <div id="status-head" class="section-title"></div>
          <div id="logcheck"></div>
          <div id="status-error"></div>
          <input id="status-search" type="search" class="search" placeholder="Search events" autocomplete="off" aria-label="Search status">
          <ul id="summary" class="card list"></ul>
        </section>

    </div>
  </div>

  <div id="screen-settings" class="view hidden">
    <header class="header header-center">
      <button type="button" id="done" class="text-btn">Done</button>
      <h1 class="title small">Settings</h1>
      <span class="header-spacer" aria-hidden="true"></span>
    </header>
    <div class="panel">
      <div class="section">
        <div class="section-title">Connection</div>
        <div class="card">
          <div class="input-group">
            <label for="url">Web app URL</label>
            <input id="url" type="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
          </div>
          <div class="input-group">
            <label for="token">Token</label>
            <input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
          </div>
          <label class="check"><input id="show-token" type="checkbox"> Show token</label>
          <div class="btn-row">
            <button type="button" id="save-settings" class="btn primary">Save</button>
            <button type="button" id="sync-now" class="btn secondary">Sync now</button>
          </div>
          <p id="sync-status" class="hint"></p>
          <div id="settings-error"></div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Appearance</div>
        <div class="card">
          <div class="setting-row last">
            <label for="theme">Theme</label>
            <select id="theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="auto">Auto</option>
            </select>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Data</div>
        <div class="card">
          <button type="button" id="clear-data" class="btn outline-destructive">Clear local data</button>
          <p class="hint">Removes the saved summary, unsynced rows, URL and token from this device. The workbook is never touched.</p>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Help</div>
        <div class="card">
          <a class="link" href="guide/" target="_blank" rel="noopener">Setup guide</a>
          <a class="link" href="mailto:135crewdog.github@gmail.com?subject=Apollo%20App%20Feedback">Send feedback</a>
        </div>
      </div>
      <p class="version">Apollo v<span id="version"></span> · All dates are Zulu</p>
    </div>
  </div>

</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="app.js"></script>
</body>
</html>
